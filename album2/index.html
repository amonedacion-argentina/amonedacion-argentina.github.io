<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Álbum AMONEDACION ARGENTINA</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <h1>Álbum AMONEDACION ARGENTINA</h1>
        <div id="wallet-section">
            <button id="connect-wallet">Conectar Wallet</button>
            <span id="wallet-address"></span>
        </div>
    </header>

    <main>
        <section id="stats-section">
            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="collection-progress"></div>
                </div>
                <span id="progress-text">0 de 0 NFTs</span>
            </div>
            <div id="category-stats"></div>
        </section>

        <section id="controls-section">
            <div class="filter-controls">
                <select id="category-filter">
                    <option value="all">Todas las categorías</option>
                    <option value="futbol">Fútbol</option>
                    <option value="flora">Flora</option>
                    <option value="fauna">Fauna</option>
                    <option value="proceres">Próceres</option>
                </select>
                <select id="trait-filter">
                    <option value="all">Todos los atributos</option>
                </select>
                <button id="show-owned">Mostrar solo mis NFTs</button>
                <button id="show-all">Mostrar todos</button>
            </div>
            <div class="pagination-controls">
                <select id="items-per-page">
                    <option value="5">5 por página</option>
                    <option value="10" selected>10 por página</option>
                    <option value="20">20 por página</option>
                    <option value="50">50 por página</option>
                </select>
                <div class="page-navigation">
                    <button id="prev-page"><i class="fas fa-chevron-left"></i></button>
                    <span id="page-indicator">Página 1</span>
                    <button id="next-page"><i class="fas fa-chevron-right"></i></button>
                </div>
            </div>
        </section>

        <section id="nfts-container">
            <div class="loading-spinner">
                <div class="spinner"></div>
                <p>Cargando NFTs...</p>
            </div>
        </section>

        <section id="pagination-section">
            <div class="pagination-controls bottom">
                <select id="items-per-page-bottom">
                    <option value="5" selected>5 por página</option>
                    <option value="10">10 por página</option>
                    <option value="20">20 por página</option>
                    <option value="50">50 por página</option>
                </select>
                <div class="page-navigation">
                    <button id="prev-page-bottom"><i class="fas fa-chevron-left"></i></button>
                    <span id="page-indicator-bottom">Página 1</span>
                    <button id="next-page-bottom"><i class="fas fa-chevron-right"></i></button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>Colección AMONEDACION ARGENTINA - Contrato: 0x199f...4a43</p>
    </footer>

    <script src="js/ethers.min.js"></script>
    <script>
        // Configuración global
        window.App = {
            config: {
                CONTRACT_ADDRESS: '0x199f5418551db3afa002470c11c2f7eba5154a43',
                OPENSEA_URL: 'https://opensea.io/assets/ethereum/',
                IPFS_HASH: 'bafybeidph7szu4urvlkzzyappcsm2nuvzeoveehx2byku4xyxwmb6eq5py'
            },
            state: {
                connected: false,
                walletAddress: null,
                nftsData: null,
                activeNFTs: [],
                filteredNFTs: [],
                ownedNFTs: new Set(),
                currentPage: 1,
                itemsPerPage: 10,
                currentFilter: 'all',
                currentTraitFilter: 'all',
                showOnlyOwned: false,
                metadataCache: {}
            },
            utils: { 
            sanitizeInput: function(input) {
                if (typeof input !== 'string') return input;
                const div = document.createElement('div');
                div.textContent = input;
                return div.innerHTML;
            },
            shortenAddress: function(address) {
                if (!address) return '';
                return `${address.substring(0, 6)}...${address.substring(38)}`;
            }
        };
    </script>
    <script src="js/wallet.js"></script>
    <script src="js/render.js"></script>
    <script src="js/pagination.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
