<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="" data-i18n="meta.description" />
  <meta name="keywords" content="" data-i18n="meta.keywords" />
  <title data-i18n="title">AMONEDACION ARGENTINA - Álbum NFT</title>
  <link rel="icon" href="../img/logo.webp" type="image/webp">
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="../css/footer.css" />
  <link rel="stylesheet" href="../css/header.css" />
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-R4801P0QGT"></script>
  <script src="../js/gtag-init.js"></script>
</head>
<body>
    <header>
        <div class="header-container">
            <img src="../img/fondo.webp" alt="AMONEDACION ARGENTINA Fondo" id="fondo" />
            <div id="presentacion">
                <img src="../img/logo.webp" alt="AMONEDACION ARGENTINA Logo" id="logo" />
                <h1 id="titulo" data-i18n="header.titulo">AMONEDACION<br>ARGENTINA</h1>
                <h2 id="subtitulo" data-i18n="header.subtitulo">ALBUM NFT</h2>
            </div>
            
            <div class="lang-container">
                <img src="../img/globo.png" alt="Idioma" class="lang-icon" />
                <select id="lang-select" aria-label="Seleccionar idioma">
                    <option value="en">English</option>
                    <option value="es">Español</option>
                </select>
            </div>

            <div class="wallet-container">
                <img src="img/wallet.png" alt="Wallet" class="wallet-icon" />
                <button id="btn-conectar" data-i18n="header.conectar">Conectar</button>
            </div>
        </div>
    </header>
    <nav>
        <ul id="nav-list">
            <li><button data-section="inicio" class="nav-btn" data-i18n="nav.inicio">Inicio</button></li>
            <li><button data-section="album" class="nav-btn active" data-i18n="nav.album">Álbum NFT</button></li>
            <li><button data-section="autor" class="nav-btn" data-i18n="nav.autor">Autor</button></li>
            <li><button data-section="catalogo" class="nav-btn" data-i18n="nav.catalogo">Catálogo de Monedas</button></li>
            <li><button data-section="whitepaper" class="nav-btn" data-i18n="nav.whitepaper">Whitepaper</button></li>
            <li><button data-section="marketplaces" class="nav-btn" data-i18n="nav.marketplaces">Mercados</button></li>
            <li><button data-section="galerias" class="nav-btn" data-i18n="nav.galerias">Galerías NFT</button></li>
            <li><button data-section="analisis" class="nav-btn" data-i18n="nav.analisis">Análisis NFT</button></li>
            <li><button data-section="redes" class="nav-btn" data-i18n="nav.redes">Redes Sociales</button></li>
        </ul>
    </nav>

    <main>
        <section id="album" class="section active">
            <section class="filtros">
                <div class="filtros-header">
                    <img id="limpiar-filtros" src="img/limpiar.png" alt="Limpiar filtros" title="Limpiar filtros" data-i18n="[title]filtros.limpiar"/>
                </div>

                <div id="div-filtro-categoria" class="filtro-group">
                    <label for="filtro-categoria" data-i18n="filtros.categoria">Categoría</label>
                    <select id="filtro-categoria" class="filtro"></select>
                </div>

                <div id="div-filtro-rareza" class="filtro-group">
                    <label for="filtro-rareza" data-i18n="filtros.rareza">Rareza</label>
                    <select id="filtro-rareza" class="filtro">
                        <option value="todas" data-i18n="atributos.todas">Todas</option>
                        <option value="r1" data-i18n="filtros.r1">🟢 R1 (Corriente)</option>
                        <option value="r2" data-i18n="filtros.r2">🔵 R2 (Escasa)</option>
                        <option value="r3" data-i18n="filtros.r3">🟠 R3 (Rara)</option>
                        <!--<option value="r4" data-i18n="filtros.r4">🔴 R4 (Muy rara)</option>
                        <option value="r5" data-i18n="filtros.r5">⚫ R5 (Extremadamente rara)</option>-->
                    </select>
                </div>

                <div id="div-filtro-valor" class="filtro-group hidden">
                    <label for="filtro-valor" data-i18n="filtros.valor">Valor</label>
                    <select id="filtro-valor" class="filtro"></select>
                </div>

                <div id="div-filtro-anio" class="filtro-group hidden">
                    <label for="filtro-anio" data-i18n="filtros.anio">Año</label>
                    <select id="filtro-anio" class="filtro"></select>
                </div>

                <div id="div-filtro-composicion" class="filtro-group hidden">
                    <label for="filtro-composicion" data-i18n="filtros.composicion">Composición</label>
                    <select id="filtro-composicion" class="filtro"></select>
                </div>

                <div id="div-filtro-alineacion" class="filtro-group hidden">
                    <label for="filtro-alineacion" data-i18n="filtros.alineacion">Alineación</label>
                    <select id="filtro-alineacion" class="filtro">
                        <option value="todas" data-i18n="atributos.todas">Todas</option>
                        <option value="medalla" data-i18n="atributos.Medalla">Medalla</option>
                        <option value="moneda" data-i18n="atributos.Moneda">Moneda</option>
                    </select>
                </div>

                <div id="div-filtro-canto" class="filtro-group hidden">
                    <label for="filtro-canto" data-i18n="filtros.canto">Canto</label>
                    <select id="filtro-canto" class="filtro"></select>
                </div>

                <div id="div-filtro-forma" class="filtro-group hidden">
                    <label for="filtro-forma" data-i18n="filtros.forma">Forma</label>
                    <select id="filtro-forma" class="filtro">
                        <option value="todas" data-i18n="atributos.todas">Todas</option>
                        <option value="circular" data-i18n="atributos.Circular">Circular</option>
                        <option value="dodecágona" data-i18n="atributos.Dodecágona">Dodecágona</option>
                        <option value="octogonal" data-i18n="atributos.Octogonal">Octogonal</option>
                    </select>
                </div>

                <div id="div-filtro-ceca" class="filtro-group hidden">
                    <label for="filtro-ceca" data-i18n="filtros.ceca">Ceca</label>
                    <select id="filtro-ceca" class="filtro"></select>
                </div>

                <div id="div-filtro-propios" class="filtro-group hidden">
                    <div class="checkbox-group">
                        <label for="filtro-propios" data-i18n="filtros.propios">Mostrar solo mis NFTs</label>
                        <input type="checkbox" id="filtro-propios">
                    </div>
                </div>
            </section>

            <div id="loading" class="hidden">
                <div class="spinner"></div>
            </div>

            <div id="banner-sorteo" class="hidden">
                <strong data-i18n="banner.sorteo">¡Sorteo exclusivo!</strong>
                <p data-i18n="banner.conecteWallet">Conecte su wallet y participe del sorteo de un NFT gratis.</p>
                <button id="btn-conectar-banner" data-i18n="banner.conectarme">Conectarme</button>
                <button id="btn-cerrar-banner" data-i18n="banner.cerrar">Cerrar</button>
            </div>

            <div id="popup-transferencia" class="popup hidden">
                <div class="popup-contenido">
                    <span id="popup-cerrar">&times;</span>
                    <h2><span data-i18n="transferencia.transferir">Transferir</span> AH# <span id="popup-moneda-ah"></span></h2>
                    <h3>(NFT# <span id="popup-nft-id"></span>)</h3>
                    
                    <form id="form-transferencia">
                        <input id="direccion-destino" type="text" required pattern="^0x[a-fA-F0-9]{40}$" placeholder="Dirección Destino" data-i18n-placeholder="transferencia.dirDestino">
                        <input id="cantidad-transferir" type="number" required min="1" step="1" placeholder="Cantidad" data-i18n-placeholder="transferencia.cantidad">
                        <button type="submit" data-i18n="transferencia.enviar">Enviar</button>
                    </form>
                </div>
            </div>

            <section id="galeria-nfts" class="grid-container"></section>

            <section class="paginador">
                <div class="paginador-container">
                    <!-- Primera página -->
                    <button id="btn-primera" class="paginador-btn paginador-flecha-doble" aria-label="Primera página">
                        <span class="paginador-flecha izquierda"></span>
                        <span class="paginador-flecha izquierda"></span>
                    </button>
                    
                    <!-- Página anterior -->
                    <button id="btn-anterior" class="paginador-btn paginador-flecha-simple" aria-label="Página anterior">
                        <span class="paginador-flecha izquierda"></span>
                    </button>
                    
                    <!-- Indicador de página -->
                    <div class="paginador-contador">
                        <span id="pagina-actual">1</span> / <span id="total-paginas">1</span>
                    </div>
                    
                    <!-- Página siguiente -->
                    <button id="btn-siguiente" class="paginador-btn paginador-flecha-simple" aria-label="Página siguiente">
                        <span class="paginador-flecha derecha"></span>
                    </button>
                    
                    <!-- Última página -->
                    <button id="btn-ultima" class="paginador-btn paginador-flecha-doble" aria-label="Última página">
                        <span class="paginador-flecha derecha"></span>
                        <span class="paginador-flecha derecha"></span>
                    </button>
                </div>

                <div id="div-filtro-paginador">
                    <label for="filtro-paginador" data-i18n="filtros.nftPorPagina">NFTs por página:</label>
                    <select id="filtro-paginador" class="filtro">
                        <option value="5">5</option>
                        <option value="10" selected>10</option>
                        <option value="20">20</option>
                        <option value="50">50</option>
                    </select>
                </div>
            </section>

            <section class="estadisticas">
                <div id="estadisticas-container" class="estadisticas-container hidden"></div>
            </section>
        </section>
    </main>

    <footer>
        <p data-i18n="footer.p-1">© 2025 AMONEDACION ARGENTINA. Todos los derechos reservados.</p>
        <p><a href="mailto:info@amonedacion-argentina.com">info@amonedacion-argentina.com</a></p>
    </footer>

    <script src="js/i18n.js"></script>
    <script src="js/ethers.min.js"></script>
    <script src="../js/toogle.js"></script>
    <script src="js/nfts.js"></script>
    <script src="js/render.js"></script>
    <script src="js/wallet.js"></script>
    <script src="js/filters.js"></script>
    <script src="js/ipfs.js"></script>
    <script src="js/script.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/transfer.js"></script>
</body>
</html>
