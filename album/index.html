<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMONEDACION ARGENTINA - Álbum Virtual</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>AMONEDACION ARGENTINA</h1>
        <h2>ALBUM VIRTUAL</h2>
        <button id="btn-conectar">Conectar Wallet</button>
        <div id="wallet-info" class="hidden">
            <span id="wallet-direccion"></span>
            <span id="wallet-estadisticas"></span>
        </div>
    </header>

    <main>
        <section class="filtros">

            <label for="filtro-categoria">Categoría:</label>
            <select id="filtro-categoria">
                <option value="">Todas las categorías</option>
            </select>

            <label for="filtro-paginacion">NFTs por página:</label>
            <select id="filtro-paginacion">
                <option value="5">5</option>
                <option value="10" selected>10</option>
                <option value="20">20</option>
                <option value="50">50</option>
            </select>
            
            <label>
                <input type="checkbox" id="filtro-propios"> Mostrar solo mis NFTs.
            </label>
        </section>

        <div id="loading" class="hidden">
            <div class="spinner"></div>
        </div>

        <section id="galeria-nfts" class="grid-container"></section>

        <section class="paginacion">
            <button id="btn-anterior">Anterior</button>
            <span id="pagina-actual">1</span>
            <button id="btn-siguiente">Siguiente</button>
        </section>
    </main>

    <script src="js/ethers.min.js"></script>
    <script src="js/render.js"></script>
    <script src="js/wallet.js"></script>
    <script src="js/pagination.js"></script>
    <script src="js/filters.js"></script>
    <script src="js/nfts.js"></script>
    <script src="js/ipfs.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
