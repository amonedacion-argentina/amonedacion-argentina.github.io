<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="" data-i18n="meta.description" />
  <meta name="keywords" content="" data-i18n="meta.keywords" />
  <title data-i18n="title">AMONEDACION ARGENTINA - Álbum Virtual</title>
  <link rel="icon" href="../img/logo.png" type="image/png">
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="../css/footer.css" />
  <link rel="stylesheet" href="../css/header.css" />
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-R4801P0QGT"></script>
  <script src="../js/gtag-init.js"></script>
</head>
<body>
    <header>
        <div class="header-container">
            <img src="../img/fondo.png" alt="AMONEDACION ARGENTINA Fondo" id="fondo" />
            <div id="presentacion">
                <img src="../img/logo.png" alt="AMONEDACION ARGENTINA Logo" id="logo" />
                <h1 id="titulo" data-i18n="header.titulo">AMONEDACION<br>ARGENTINA</h1>
                <h2 id="subtitulo" data-i18n="header.subtitulo">ALBUM VIRTUAL</h2>
            </div>
            
            <div class="lang-container">
                <img src="../img/globo.png" alt="Idioma" class="lang-icon" />
                <select id="lang-select" aria-label="Seleccionar idioma">
                <option value="en">English</option>
                <option value="es">Español</option>
                </select>
            </div>

            <div class="wallet-container">
                <img src="img/wallet.png" alt="Wallet" class="wallet-icon" />
                <button id="btn-conectar">Conectar</button>
                <div id="wallet-info" class="hidden">
                    <span id="wallet-direccion"></span>
                    <span id="wallet-estadisticas"></span>
                </div>
            </div>
        </div>
    </header>
    <nav>
        <ul id="nav-list">
        <li><button data-section="inicio" class="nav-btn" data-i18n="nav.inicio">Inicio</button></li>
        <li><button data-section="album" class="nav-btn active" data-i18n="nav.album">Álbum NFT</button></li>
        <li><button data-section="autor" class="nav-btn" data-i18n="nav.autor">Autor</button></li>
        <li><button data-section="catalogo" class="nav-btn" data-i18n="nav.catalogo">Catálogo de Monedas</button></li>
        <li><button data-section="whitepaper" class="nav-btn" data-i18n="nav.whitepaper">Whitepaper</button></li>
        <li><button data-section="marketplaces" class="nav-btn" data-i18n="nav.marketplaces">Mercados</button></li>
        <li><button data-section="galerias" class="nav-btn" data-i18n="nav.galerias">Galerías NFT</button></li>
        <li><button data-section="analisis" class="nav-btn" data-i18n="nav.analisis">Análisis NFT</button></li>
        <li><button data-section="redes" class="nav-btn" data-i18n="nav.redes">Redes Sociales</button></li>
        </ul>
    </nav>

    <main>
        <section id="album" class="section active">
            <section class="filtros">
                <label for="filtro-categoria">Categoría:</label>
                <select id="filtro-categoria">
                    <option value="">Todas las categorías</option>
                </select>

                <label for="filtro-paginacion">NFTs por página:</label>
                <select id="filtro-paginacion">
                    <option value="5">5</option>
                    <option value="10" selected>10</option>
                    <option value="20">20</option>
                    <option value="50">50</option>
                </select>

                <div class="checkbox-group"></div>
                    <input type="checkbox" id="filtro-propios">
                    <label for="filtro-propios">Mostrar solo mis NFTs</label>
                </div>
            </section>

            <div id="loading" class="hidden">
                <div class="spinner"></div>
            </div>

            <section id="galeria-nfts" class="grid-container"></section>

            <section class="paginacion">
                <button id="btn-anterior">Anterior</button>
                <span id="pagina-actual">1</span>
                <button id="btn-siguiente">Siguiente</button>
            </section>
        </section>
    </main>

    <footer>
        <p data-i18n="footer.p-1">© 2025 AMONEDACION ARGENTINA. Todos los derechos reservados.</p>
        <p><a href="mailto:info@amonedacion-argentina.com">info@amonedacion-argentina.com</a></p>
    </footer>

    <script src="js/ethers.min.js"></script>
    <script src="js/render.js"></script>
    <script src="js/wallet.js"></script>
    <script src="js/pagination.js"></script>
    <script src="js/filters.js"></script>
    <script src="js/nfts.js"></script>
    <script src="js/ipfs.js"></script>
    <script src="js/script.js"></script>
    <script src="js/nav.js"></script>
</body>
</html>
