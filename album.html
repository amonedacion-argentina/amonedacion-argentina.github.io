<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mis NFTs - Amonedacion Argentina</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 20px;
  }
  #nftContainer > div {
    border: 1px solid #ccc;
    margin: 10px;
    padding: 10px;
    width: 250px;
    display: inline-block;
    vertical-align: top;
    box-shadow: 2px 2px 6px #aaa;
    border-radius: 8px;
  }
  #nftContainer img {
    width: 100%;
    height: auto;
    border-radius: 6px;
  }
  #connectWallet {
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
  }
</style>
</head>
<body>
<h1>Tus NFTs en Ethereum</h1>
<button id="connectWallet">Conectar Wallet</button>
<div id="nftContainer"></div>

<!-- Cargar ethers.js desde CDN confiable -->
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

<script>
  const connectWalletButton = document.getElementById('connectWallet');
  const nftContainer = document.getElementById('nftContainer');

  connectWalletButton.onclick = async () => {
    if (!window.ethereum) {
      alert('Por favor instala MetaMask para continuar');
      return;
    }

    if (typeof ethers === 'undefined') {
      alert('Error: La librería ethers.js no está cargada');
      return;
    }

    try {
      // Solicitar conexión a la wallet
      await window.ethereum.request({ method: 'eth_requestAccounts' });
      const provider = new ethers.providers.Web3Provider(window.ethereum);
      const signer = provider.getSigner();
      const address = await signer.getAddress();

      nftContainer.innerHTML = `<p>Wallet conectada: ${address}</p><p>Cargando NFTs...</p>`;

      // Consultar NFTs desde la API pública de OpenSea con API key
      const response = await fetch(`https://api.opensea.io/api/v1/assets?owner=${address}&order_direction=desc&limit=20&include_orders=false`, {
        headers: {
          'X-API-KEY': '5c61b05c78054ac387199950df861e0e'
        }
      });

      if (!response.ok) {
        throw new Error(`Error en la consulta: ${response.status}`);
      }

      const data = await response.json();

      if (!data.assets || data.assets.length === 0) {
        nftContainer.innerHTML += '<p>No se encontraron NFTs en esta wallet.</p>';
        return;
      }

      // Mostrar NFTs
      nftContainer.innerHTML = '';
      data.assets.forEach(asset => {
        const nftHtml = `
          <div>
            <img src="${asset.image_preview_url || asset.image_url || ''}" alt="${asset.name || 'Sin nombre'}" />
            <h3>${asset.name || 'Sin nombre'}</h3>
            <p><strong>Token ID:</strong> ${asset.token_id}</p>
            <p><strong>Contrato:</strong> ${asset.asset_contract.address}</p>
            <a href="${asset.permalink}" target="_blank" rel="noopener noreferrer">Ver en OpenSea</a>
          </div>
        `;
        nftContainer.innerHTML += nftHtml;
      });

    } catch (error) {
      console.error(error);
      alert('Error conectando la wallet o cargando NFTs: ' + error.message);
    }
  }
</script>
</body>
</html>
