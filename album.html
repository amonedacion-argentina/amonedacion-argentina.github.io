<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Mis NFTs - Amonedacion Argentina</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    #nfts { display: flex; flex-wrap: wrap; gap: 15px; margin-top: 20px; }
    .nft-card {
      border: 1px solid #ccc; border-radius: 8px; padding: 10px; width: 180px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .nft-card img {
      max-width: 100%; border-radius: 6px;
    }
    .nft-name {
      font-weight: bold; margin: 10px 0 5px;
      font-size: 1em; height: 40px; overflow: hidden;
    }
    button {
      cursor: pointer; padding: 10px 15px; font-size: 1em; border: none; border-radius: 6px;
      background-color: #0072ce; color: white;
    }
    button:hover {
      background-color: #005bb5;
    }
  </style>
</head>
<body>

  <h1>Mis NFTs - Amonedacion Argentina</h1>
  <button id="connectWalletButton">Conectar Wallet</button>

  <div id="walletAddress" style="margin-top: 10px; font-weight: bold;"></div>

  <div id="nfts"></div>

  <script>
    const apiKey = '5c61b05c78054ac387199950df861e0e'; // tu API key de OpenSea
    let userAddress = '';

    async function connectWallet() {
      if (!window.ethereum) {
        alert('MetaMask no está instalado. Por favor instálalo para continuar.');
        return;
      }
      try {
        const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
        userAddress = accounts[0];
        document.getElementById('walletAddress').textContent = `Wallet conectada: ${userAddress}`;
        loadNFTs(userAddress);
      } catch (error) {
        alert('Error al conectar la wallet.');
        console.error(error);
      }
    }

    async function loadNFTs(address) {
      const nftsDiv = document.getElementById('nfts');
      nftsDiv.innerHTML = 'Cargando NFTs...';

      try {
        const response = await fetch(`https://api.opensea.io/api/v2/assets?owner=${address}&limit=20`, {
          headers: {
            'X-API-KEY': apiKey
          }
        });
        if (!response.ok) throw new Error(`Error en la consulta: ${response.status}`);

        const data = await response.json();
        const assets = data.assets || [];

        if (assets.length === 0) {
          nftsDiv.innerHTML = 'No se encontraron NFTs para esta wallet.';
          return;
        }

        nftsDiv.innerHTML = '';
        assets.forEach(asset => {
          const img = asset.image_url || asset.image_preview_url || '';
          const name = asset.name || 'NFT sin nombre';

          const card = document.createElement('div');
          card.className = 'nft-card';

          const imgElem = document.createElement('img');
          imgElem.src = img;
          imgElem.alt = name;
          card.appendChild(imgElem);

          const nameElem = document.createElement('div');
          nameElem.className = 'nft-name';
          nameElem.textContent = name;
          card.appendChild(nameElem);

          nftsDiv.appendChild(card);
        });
      } catch (error) {
        nftsDiv.innerHTML = 'Error cargando NFTs.';
        console.error('Error en la consulta:', error);
      }
    }

    document.getElementById('connectWalletButton').addEventListener('click', connectWallet);
  </script>

</body>
</html>
