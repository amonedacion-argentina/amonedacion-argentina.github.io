<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NFTs - Amonedacion Argentina</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 600px; margin: auto; padding: 1rem; }
  button { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
  .nft-list { margin-top: 1rem; display: grid; grid-template-columns: repeat(auto-fill,minmax(150px,1fr)); gap: 1rem; }
  .nft-item { border: 1px solid #ccc; border-radius: 8px; padding: 0.5rem; text-align: center; }
  .nft-item img { max-width: 100%; border-radius: 6px; }
</style>
</head>
<body>

<h1>Mostrar NFTs de mi Wallet</h1>

<button id="connectWalletButton">Conectar Wallet y cargar NFTs</button>

<div id="nfts" class="nft-list"></div>

<script>
const apiKey = "952b8e1e814e400eaae026892617b0d5";

async function fetchNFTs(ownerAddress) {
  const url = `https://api.opensea.io/api/v2/assets?owner=${ownerAddress}&limit=20`;
  
  const response = await fetch(url, {
    headers: { 'X-API-KEY': apiKey }
  });
  
  if (!response.ok) {
    throw new Error(`Error en la consulta: ${response.status}`);
  }
  
  const data = await response.json();
  return data.assets;
}

async function connectWalletAndLoadNFTs() {
  if (!window.ethereum) {
    alert("Por favor instala MetaMask para continuar.");
    return;
  }
  
  try {
    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
    const ownerAddress = accounts[0];
    
    const nfts = await fetchNFTs(ownerAddress);
    displayNFTs(nfts);
  } catch (error) {
    alert("Error conectando la wallet o cargando NFTs: " + error.message);
  }
}

function displayNFTs(nfts) {
  const container = document.getElementById("nfts");
  container.innerHTML = "";

  if (nfts.length === 0) {
    container.innerHTML = "<p>No se encontraron NFTs para esta wallet.</p>";
    return;
  }

  nfts.forEach(nft => {
    const div = document.createElement("div");
    div.className = "nft-item";
    div.innerHTML = `
      <img src="${nft.image_url || ''}" alt="${nft.name || 'NFT'}" />
      <h3>${nft.name || 'NFT sin nombre'}</h3>
      <p>${nft.collection ? nft.collection.name : ''}</p>
    `;
    container.appendChild(div);
  });
}

document.getElementById("connectWalletButton").onclick = connectWalletAndLoadNFTs;
</script>

</body>
</html>
